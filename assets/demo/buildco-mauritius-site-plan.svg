<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">BuildCo Mauritius demonstration site plan</title>
  <desc id="desc">Illustrative layout for a sugar factory and bagasse cogeneration facility. Not for construction or emergency use.</desc>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf7ef"/><stop offset="1" stop-color="#dcefe2"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a7c7b0" stroke-width="1" opacity=".35"/></pattern>
    <style>.b{stroke:#20372a;stroke-width:3}.t{font:700 22px Arial;fill:#163523}.s{font:600 15px Arial;fill:#355b43}.road{fill:none;stroke:#788a7e;stroke-width:34;stroke-linecap:round}.lane{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:14 12}.risk-hi{fill:#f36b5c}.risk-med{fill:#f6c453}.risk-low{fill:#62b77d}</style>
  </defs>
  <rect width="1200" height="760" fill="url(#ground)"/><rect width="1200" height="760" fill="url(#grid)"/>
  <path class="road" d="M40 670C240 610 360 700 520 640S850 640 1160 670"/><path class="lane" d="M40 670C240 610 360 700 520 640S850 640 1160 670"/>
  <g class="b"><rect x="65" y="75" width="255" height="190" rx="18" fill="#d8ecd5"/><rect x="365" y="70" width="305" height="220" rx="18" fill="#f3dfab"/><rect x="720" y="70" width="405" height="220" rx="18" fill="#f4c1bc"/><rect x="80" y="345" width="270" height="205" rx="18" fill="#d5e8f6"/><rect x="405" y="355" width="265" height="190" rx="18" fill="#e4ddf4"/><rect x="735" y="345" width="390" height="210" rx="18" fill="#cceae2"/></g>
  <g text-anchor="middle"><text class="t" x="192" y="150">Cane Reception</text><text class="s" x="192" y="180">weighbridge · unloading · conveyors</text><text class="t" x="518" y="150">Milling House</text><text class="s" x="518" y="180">crushers · juice extraction · centrifugals</text><text class="t" x="922" y="145">Boiler &amp; Turbine Power House</text><text class="s" x="922" y="175">bagasse boilers · steam · 24 MW generator</text><text class="t" x="215" y="420">Bagasse Yard</text><text class="s" x="215" y="450">fuel storage · mobile plant · dust zone</text><text class="t" x="538" y="425">Workshop &amp; Stores</text><text class="s" x="538" y="455">maintenance · welding · spares</text><text class="t" x="930" y="420">Laboratory &amp; Effluent Plant</text><text class="s" x="930" y="450">quality lab · chemicals · wastewater</text></g>
  <g><circle class="risk-med b" cx="192" cy="225" r="18"/><circle class="risk-med b" cx="518" cy="235" r="18"/><circle class="risk-hi b" cx="922" cy="235" r="18"/><circle class="risk-hi b" cx="215" cy="505" r="18"/><circle class="risk-med b" cx="538" cy="500" r="18"/><circle class="risk-low b" cx="930" cy="505" r="18"/></g>
  <g transform="translate(48 708)"><rect width="520" height="34" rx="8" fill="#fff" opacity=".94"/><circle cx="25" cy="17" r="8" fill="#f36b5c"/><text class="s" x="42" y="22">High</text><circle cx="115" cy="17" r="8" fill="#f6c453"/><text class="s" x="132" y="22">Medium</text><circle cx="235" cy="17" r="8" fill="#62b77d"/><text class="s" x="252" y="22">Controlled</text><text class="s" x="365" y="22">DEMO PLAN — NOT TO SCALE</text></g>
</svg>
