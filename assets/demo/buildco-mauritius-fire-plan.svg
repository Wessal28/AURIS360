<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">BuildCo Mauritius demonstration fire and evacuation plan</title>
  <desc id="desc">Illustrative fire plan for a sugar factory and power house. Not for emergency use.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#168552"/></marker><style>.wall{fill:#f8faf9;stroke:#243b2c;stroke-width:5}.room{fill:#e9f1ec;stroke:#6b8272;stroke-width:2}.t{font:700 21px Arial;fill:#193725}.s{font:600 14px Arial;fill:#42604c}.route{fill:none;stroke:#168552;stroke-width:9;stroke-dasharray:18 10;marker-end:url(#arrow)}.exit{fill:#168552}.haz{fill:#f36b5c}</style></defs>
  <rect width="1200" height="760" fill="#eef4ef"/><rect class="wall" x="70" y="70" width="1060" height="560" rx="18"/>
  <rect class="room" x="95" y="95" width="295" height="210"/><rect class="room" x="410" y="95" width="300" height="210"/><rect class="room" x="730" y="95" width="375" height="210"/><rect class="room" x="95" y="325" width="295" height="280"/><rect class="room" x="410" y="325" width="300" height="280"/><rect class="room" x="730" y="325" width="375" height="280"/>
  <g text-anchor="middle"><text class="t" x="242" y="165">Cane Milling</text><text class="s" x="242" y="195">Conveyor drives</text><text class="t" x="560" y="165">Process Floor</text><text class="s" x="560" y="195">Evaporators · centrifugals</text><text class="t" x="918" y="165">Boiler Hall</text><text class="s" x="918" y="195">Steam plant · fuel feed</text><text class="t" x="242" y="410">Workshop</text><text class="s" x="242" y="440">Hot work bay</text><text class="t" x="560" y="410">Control Room</text><text class="s" x="560" y="440">Alarm panel · shutdown</text><text class="t" x="918" y="410">Turbine Hall</text><text class="s" x="918" y="440">Generator · lube oil</text></g>
  <path class="route" d="M235 230V650H80"/><path class="route" d="M565 230V650H1080"/><path class="route" d="M920 230V650H1080"/><path class="route" d="M245 500V650H80"/>
  <g class="exit"><rect x="62" y="625" width="28" height="58"/><rect x="1110" y="625" width="28" height="58"/></g><text class="t" x="25" y="710">MUSTER A</text><text class="t" x="1010" y="710">MUSTER B</text>
  <g><circle class="haz" cx="330" cy="260" r="17"/><circle class="haz" cx="675" cy="260" r="17"/><circle class="haz" cx="1060" cy="260" r="17"/><circle class="haz" cx="330" cy="555" r="17"/><circle class="haz" cx="675" cy="555" r="17"/><circle class="haz" cx="1060" cy="555" r="17"/></g>
  <g transform="translate(370 668)"><rect width="460" height="55" rx="10" fill="#fff"/><text class="s" x="20" y="23">Green dashed line: evacuation route</text><text class="s" x="20" y="43">Red points: fire equipment positions in AURIS</text></g><text class="s" x="870" y="740">DEMO PLAN — NOT FOR EMERGENCY USE</text>
</svg>
