name: Staging acceptance

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      preview_url:
        description: HTTPS URL of the Vercel Preview deployment
        required: true
        type: string

permissions:
  contents: read
  deployments: read

concurrency:
  group: staging-acceptance-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production')
    name: Verify isolated staging deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      STAGING_APP_URL: ${{ inputs.preview_url || github.event.deployment_status.target_url }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Check out deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Use supported Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify staging isolation and module data sources
        run: npm run staging:acceptance -- --report release-evidence/staging-${{ github.sha }}.json

      - name: Retain staging acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-acceptance-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 30
