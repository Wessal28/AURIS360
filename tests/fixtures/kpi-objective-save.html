<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objective save — synthetic QA</title><link rel="stylesheet" href="/auris-base.css"><link rel="stylesheet" href="/auris-kpi-legacy.css"><link rel="stylesheet" href="/kpi-module-upgrade.css"><style>body{display:block;margin:0;background:#f8fafc}main{padding:24px}nav{display:flex;gap:12px;flex-wrap:wrap}#fixture-result{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h1>Objective save outcomes</h1><p>Synthetic data only; no external services.</p><nav><label>Simulated service <select id="fixture-mode"><option value="failure">Write failure</option><option value="refresh">Refresh failure</option><option value="changed">Company changes during save</option><option value="missing">Missing returned identity</option><option value="success">Success</option></select></label><button id="fixture-open" class="btn">New objective</button><button id="fixture-edit" class="btn">Edit objective</button><select id="year-sel" aria-label="Scorecard year"><option>2026</option></select></nav><p id="fixture-result" role="status">No simulated writes.</p></main><!-- OBJECTIVE_PANEL -->
<script>
var prof={id:'qa-user',company_id:'company-a'},company='company-a',kpiSelectedColor='#1D9E75',kpiObjectives=[{id:'o',company_id:'company-a',year:2026,name:'Original synthetic objective',code:'1',color:'#1D9E75'}],kpiKPIs=[],kpiIndicators=[],kpiMonthlyData={},fixtureStored=null,fixtureWrites=0;

async function api(url,options){const mode=document.getElementById('fixture-mode').value;if(options){fixtureWrites++;toast('Saving synthetic objective…');await new Promise(resolve=>setTimeout(resolve,900));if(mode==='failure')throw new Error('Example connection failure.');fixtureStored={id:options.m==='PATCH'?'o':'synthetic-new',...options.b};if(mode==='changed')company='company-b';return mode==='missing'?[]:[fixtureStored];}if(url.includes('select=code'))return [{code:'1'}];if(mode==='refresh')throw new Error('Example refresh failure.');const rows=fixtureStored?[fixtureStored,...kpiObjectives.filter(row=>row.id!==fixtureStored.id)]:kpiObjectives;const params=new URL('http://synthetic.local'+url).searchParams;return rows.filter(row=>(!params.has('id')||row.id===params.get('id').slice(3))&&(!params.has('year')||String(row.year)===params.get('year').slice(3)));}

</script><script src="/fixture-core.js"></script><script src="/auris-static-event-handlers.js"></script></body></html>
