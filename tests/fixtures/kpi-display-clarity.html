<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI display clarity — synthetic QA</title><link rel="stylesheet" href="/kpi-module-upgrade.css"><style>body{font:15px Arial,sans-serif;margin:0;background:#f4f7f9;color:#17324a}main{padding:16px}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;min-height:44px}h1{font-size:24px}#year-sel{display:none}</style></head><body><main id="page-kpi" data-kpi-x-installed="1"><h1>KPI display clarity</h1><p>Synthetic results only. No external API calls.</p><select id="year-sel"><option selected>2025</option></select><nav><button data-view="scorecard">Scorecard</button><button data-view="dashboard">Dashboard</button></nav><div id="kpi-objectives-container" class="kpi-x-view" data-kpi-view="scorecard"></div><div id="kpi-x-dashboard" class="kpi-x-view" data-kpi-view="dashboard"></div></main><script>
window.kpiObjectives=[{id:'missing',code:'1',name:'Awaiting monthly performance results'},{id:'zero',code:'2',name:'Genuine zero achievement'},{id:'partial',code:'3',name:'Partially reported objective'}];
window.kpiKPIs=[{id:'k1',code:'1.1',objective_id:'missing',name:'Unreported KPI',frequency:'monthly'},{id:'k2',code:'2.1',objective_id:'zero',name:'Measured zero',frequency:'monthly'},{id:'k3',code:'3.1',objective_id:'partial',name:'Reported KPI',frequency:'monthly'},{id:'k4',code:'3.2',objective_id:'partial',name:'Pending KPI',frequency:'monthly'}];
window.kpiIndicators=window.kpiKPIs.map((k,i)=>({id:'i'+(i+1),kpi_id:k.id,name:'Measurement '+(i+1),target_operator:'gte',target_value:100}));
window.kpiMonthlyData={i2:{12:{month:12,actual:0}},i3:{12:{month:12,actual:100}}};window.kpiConfigPublished={targets:{critical_override:true},calculations:{aggregation:'average'}};window.isMgr=()=>false;
</script><script src="/kpi-module-upgrade.js"></script><script>
document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>kpiXSwitchTab(button.dataset.view)));
document.addEventListener('DOMContentLoaded',()=>kpiXSwitchTab('scorecard'));
</script></body></html>
