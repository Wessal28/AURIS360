async function api(url,options){const mode=document.getElementById('fixture-mode').value;if(mode==='locked')storedKpis[1].approval_status='locked';const parsed=new URL('http://synthetic.local'+url),rows=(parsed.pathname==='/objectives'?storedObjectives:storedKpis).filter(row=>[...parsed.searchParams].every(([key,value])=>['select','limit'].includes(key)||value==='is.null'?(['select','limit'].includes(key)||row[key]==null):String(row[key])===value.slice(3)));if(options){if(options.m!=='PATCH')throw new Error('Fixture permits archive PATCH only');writes++;showResult('Updating synthetic archive');await new Promise(r=>setTimeout(r,900));if(mode==='failure'||mode==='partial'&&rows.some(r=>r.id==='second'))throw new Error('Example write connection failure.');rows.forEach(row=>Object.assign(row,options.b));if(mode==='changed')company='other';}else if(mode==='refresh'&&writes)throw new Error('Example refresh failure.');return structuredClone(rows);}
