<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI monthly navigation — synthetic QA</title><link rel="stylesheet" href="/kpi-module-upgrade.css"><style>body{font:15px Arial,sans-serif;margin:0;color:#17324a}button,input,select{font:inherit}*,*:before,*:after{box-sizing:border-box}.fixture-notice{padding:12px;background:#fff7ed}#page-kpi .kpi-x-view{min-width:0}</style></head>
<body><div class="fixture-notice">Synthetic KPI monthly navigation test. No external APIs or business records.</div>
<div class="fixture-notice"><button type="button" id="fixture-no-indicators">Open KPI without indicators</button><button type="button" id="fixture-removed">Open obsolete KPI</button></div><main id="page-kpi"><header class="kpi-page-header"><select id="year-sel"><option selected>2025</option></select></header><nav><button class="kpi-tab">Scorecard</button></nav><div id="kpi-metrics"></div><section id="kpi-tab-overview"><div id="kpi-objectives-container"></div></section><section id="kpi-tab-monthly"><div class="card"><header>Monthly</header><div><table id="kpi-monthly-table"><thead></thead><tbody id="kpi-monthly-body"></tbody></table></div></div></section></main>
<script>
window.kpiObjectives=[{id:'safety',code:'1',name:'Safety performance'},{id:'people',code:'2',name:'People development'}];
window.kpiKPIs=[{id:'off',code:'1.1',objective_id:'safety',name:'Toolbox coverage',owner:'Alice',frequency:'monthly'},{id:'risk',code:'1.2',objective_id:'safety',name:'Inspection coverage',owner:'Alice',frequency:'monthly'},{id:'missing',code:'1.3',objective_id:'safety',name:'Emergency drill coverage',owner:'Bob',frequency:'quarterly'},{id:'on',code:'2.1',objective_id:'people',name:'Training completion',owner:'Bob',frequency:'annual'}];

</script><script src="/auris-module-event-handlers-batch-3.js"></script><script src="/kpi-module-upgrade.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{kpiUpdateMetrics();kpiXSwitchTab('dashboard');}); document.getElementById('fixture-no-indicators').addEventListener('click',()=>{kpiIndicators=kpiIndicators.filter(ind=>ind.kpi_id!=='off');kpiXOpenDrawer('off');}); document.getElementById('fixture-removed').addEventListener('click',()=>{kpiXOpenDrawer('off');kpiKPIs=kpiKPIs.filter(k=>k.id!=='off');});</script></body></html>
