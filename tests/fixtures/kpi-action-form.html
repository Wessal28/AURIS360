<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI recovery action — synthetic QA</title><link rel="stylesheet" href="/kpi-module-upgrade.css"><link rel="stylesheet" href="/kpi-data-source.css"><style>body{font:15px 'Segoe UI',Arial,sans-serif;margin:0;color:#17324a}main{padding:20px}button,select{font:inherit;min-height:44px}nav{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}#fixture-result{overflow-wrap:anywhere}.kpi-x-drawer{font-family:'Segoe UI',Arial,sans-serif}</style></head><body><main><h1>KPI recovery action</h1><p>Synthetic interaction test — no external API or business records.</p><nav><label>Simulated service <select id="fixture-mode"><option value="failure">Save failure</option><option value="success">Save success</option><option value="link-failure">Relationship failure</option><option value="changed">Company changes during save</option></select></label><button id="fixture-open" data-auris-module-onclick="d0007" data-auris-module-args="%5B%22k%22%5D">Create Action</button></nav><p id="fixture-result" role="status">No simulated saves.</p></main>
<script>
window.kpiKPIs=[{id:'k',code:'1.1',name:'Toolbox talk coverage',company_id:'company-a',owner:'Safety coordinator'}];window.kpiIndicators=[];window.kpiObjectives=[];window.kpiMonthlyData={};window.prof={id:'qa-user',company_id:'company-a'};window.ccid=()=>prof.company_id;window.fixtureSaves=0;
window.nextCompanyRef=async()=>{await new Promise(resolve=>setTimeout(resolve,600));return 'MAP-KPI-QA-001';};
window.api=async(path,options)=>{if(path!=='/action_tracker'||options.m!=='POST')throw new Error('Unexpected synthetic API');fixtureSaves++;document.getElementById('fixture-result').textContent=fixtureSaves+' simulated save attempt(s).';await new Promise(resolve=>setTimeout(resolve,300));var mode=document.getElementById('fixture-mode').value;if(mode==='failure')throw new Error('Example connection failure — form values must remain available.');if(mode==='changed')prof.company_id='company-b';return [{id:'synthetic-action',action_ref:'MAP-KPI-QA-001'}];};
window.relationshipCreate=async()=>{if(document.getElementById('fixture-mode').value==='link-failure')throw new Error('Synthetic relationship failure');};window.toast=text=>document.getElementById('fixture-result').textContent=text;
document.getElementById('fixture-open').addEventListener('click',()=>{prof.company_id='company-a';});
</script><script src="/auris-module-event-handlers-batch-3.js"></script><script src="/kpi-module-upgrade.js"></script></body></html>
