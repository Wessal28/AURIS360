<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI indicator identity — synthetic QA</title><link rel="stylesheet" href="/auris-base.css"><link rel="stylesheet" href="/auris-kpi-legacy.css"><link rel="stylesheet" href="/kpi-module-upgrade.css"><style>body{display:block;margin:0;background:#f8fafc}main{padding:24px}nav{display:flex;gap:12px;flex-wrap:wrap}#fixture-result{white-space:pre-wrap;overflow-wrap:anywhere}</style><link rel="stylesheet" href="/auris-settings-static.css"></head><body><main><h1>Indicator history preservation</h1><p>Synthetic records only. No external services.</p><nav><label>Simulated service <select id="fixture-mode"><option value="success">Success</option><option value="partial">Transaction response lost</option><option value="changed">Company changes after write</option><option value="refresh">Incomplete response</option></select></label><button id="fixture-open" class="btn">Edit synthetic KPI</button><select id="year-sel" aria-label="Scorecard year"><option>2026</option></select></nav><p id="fixture-result" role="status">Indicator i has an August result of 4.</p></main><!-- KPI_PANEL -->
<script>
function appConfirmAction(options){return appConfirm(options);}
var interrupted=document.createElement('button');interrupted.type='button';interrupted.textContent='Simulate interrupted edit';interrupted.onclick=function(){var modal=document.getElementById('kpi-edit-modal');modal.style.display='none';modal._editorDraft=null;};document.getElementById('kpi-edit-modal').firstElementChild.appendChild(interrupted);
window.addEventListener('error',function(event){document.getElementById('fixture-result').textContent=event.message;});
function activeRole(){return 'admin';}

var prof={id:'u',company_id:'c'},company='c',kpiEditKpiId=null,kpiObjectives=[{id:'o',company_id:'c',name:'Safe work',code:'1',year:2026}],kpiKPIs=[{definition_revision:1,id:'k',company_id:'c',objective_id:'o',name:'Safety conversations',code:'1.1',year:2026,frequency:'monthly',status:'not_started',approval_status:'draft',responsible:'QA person',data_provider:'QA person',reviewer:'QA person',approver:'QA person',data_source:'Manual'}],kpiIndicators=[{id:'i',company_id:'c',kpi_id:'k',name:'Number of toolbox talks',target_value:4,target_operator:'gte',unit:null,ytd_method:'sum',sort_order:0}],kpiMonthlyData={i:{8:{indicator_id:'i',company_id:'c',year:2026,month:8,actual:4,ytd:4}}},storedIndicators=structuredClone(kpiIndicators),storedParent=structuredClone(kpiKPIs[0]),writes=0;
function ccid(){return company;}function isMgr(){return true;}function kpiObjectiveCompany(){return company;}function kpiObjectiveViewYear(){return 2026;}function kpiRenderOverview(){}function kpiRenderMonthly(){}function kpiUpdateMetrics(){}
function fillPplDrops(){['kpi-resp','kpi-data-provider','kpi-reviewer','kpi-approver'].forEach(id=>{const n=document.getElementById(id);if(n)n.innerHTML='<option value="">Select person...</option><option>QA person</option>';});}function tenantPeople(){return [{id:'qa'}];}async function loadPeopleCache(){}function setSelectValueWithFallback(id,value){const n=document.getElementById(id);if(n){if(!Array.from(n.options).some(o=>o.value===value))n.add(new Option(value,value));n.value=value;}}
function toast(message){document.getElementById('fixture-result').textContent=message+' — '+writes+' simulated writes. '+storedIndicators.map(i=>'Indicator '+i.id+': '+i.name).join('; ')+'. August result remains attached to i: 4.';}
async function api(url,options){
 const mode=document.getElementById('fixture-mode').value,params=new URL('http://synthetic.local'+url).searchParams;
 if(options){
  if(url!=='/rpc/save_kpi_definition')throw new Error('Unexpected non-atomic write');
  writes++;await new Promise(r=>setTimeout(r,700));
  storedParent={...storedParent,...options.b.p_definition,definition_revision:storedParent.definition_revision+1};
  storedIndicators=options.b.p_indicators.map((i,index)=>({...i,id:i.id||'new-'+writes+'-'+index,company_id:'c',kpi_id:'k'}));
  if(mode==='partial')throw new Error('Transaction response connection lost.');
  if(mode==='changed')company='other';
  return {kpi:structuredClone(storedParent),indicators:mode==='refresh'?[]:structuredClone(storedIndicators),monthly:[structuredClone(kpiMonthlyData.i[8])]};
 }
 if(url.startsWith('/kpi_indicators'))return structuredClone(storedIndicators);
 if(url.startsWith('/kpi_monthly_data'))return params.has('limit')?[{id:'history'}]:[structuredClone(kpiMonthlyData.i[8])];
 throw new Error('Unexpected synthetic URL');
}
document.getElementById('fixture-open').onclick=function(){company='c';openKpiAddModal('k','o');};
