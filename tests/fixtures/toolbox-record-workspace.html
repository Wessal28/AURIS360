<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolbox talk record verification</title>
<link rel="stylesheet" href="../../auris-record-workspace.css"><style>body{margin:0;padding:24px;font:14px Arial,sans-serif;background:#f4f7fa}#controls{display:flex;gap:10px;flex-wrap:wrap}#controls button{min-height:44px;font:inherit}</style></head>
<body><h1>Toolbox talk record verification</h1><p>Synthetic records only. No database or attendance changes.</p><div id="controls"><button id="open">Open talk overview</button><button id="missing">Open missing data</button><button id="history">Open unavailable history</button><button id="fail">Open form failure</button><button id="stale">Open changed session</button></div><p id="result" role="status"></p>
<script>
let unavailable=false,fail=false,missing=false,viewValid=true;const identity={company:{id:'fixture-company'},profile:{id:'fixture-user'},role:'manager'};
const record={id:'talk-1',company_id:'fixture-company',tbt_ref:'TBT-2026-001',title:'Safe handling of chemicals and emergency response',status:'planned',topic_category:'chemical',talk_date:'2026-09-08',location:'Storage area',department:'Operations',presenter:'Fixture presenter',duration_mins:0,key_points:'Check labels before handling.\nUse suitable gloves.\nReview emergency response.',hazards_discussed:'Chemical splash <script text>',attendees:[{name:'Fixture attendee',dept:'Operations',organization_snapshot:'Fixture company',role_snapshot:'Operator',confirmed_at:'2026-09-08T08:30:00+04:00',confirmation_method:'employee_code'},{name:'Unconfirmed attendee'}],attendance_count:12,actions_raised:[{description:'Inspect gloves',assigned_to:'Fixture supervisor',due_date:'2026-09-09'}],notes:'Retained notes\n\n[AURIS360_LINKED_WORK:{"id":"work-1","ref":"WS-001","title":"Chemical handling"}]'};
window.AurisPlatformServices={ready:()=>true,auth:{isReady:()=>true,isAuthenticated:()=>true,current:()=>identity},rbac:{requireAccess:()=>{}},api:{request:async url=>{
  if(url.startsWith('/toolbox_talks?'))return [missing?{id:'talk-1',company_id:'fixture-company',title:'Incomplete recorded talk',attendees:{bad:true},actions_raised:[null],notes:'Retained malformed marker [AURIS360_LINKED_WORK:{bad}]'}:record];if(unavailable)throw Error('History unavailable');
  if(url.startsWith('/work_activities?'))return [{id:'w1',company_id:'fixture-company',source_module:'meetings',source_table:'toolbox_talks',source_record_id:'talk-1',activity_type:'comment',body:'Recorded review <script text>',evidence:[{label:'Review report',url:'https://example.invalid/review'}]}];
  if(url.startsWith('/approval_requests?'))return [{id:'p1',company_id:'fixture-company',module_name:'meetings',related_table:'toolbox_talks',related_id:'talk-1',status:'pending',request_reason:'Shared follow-up only; not attendance confirmation'}];return [];
}}};
</script><script src="../../auris-record-workspace.js"></script><script src="../../auris-toolbox-list-workspace.js"></script><script src="../../auris-toolbox-record-workspace.js"></script><script>
async function launch(mode){identity.company.id='fixture-company';viewValid=true;missing=mode==='missing';unavailable=mode==='history';fail=mode==='fail';document.getElementById('result').textContent='';await AurisToolboxRecordWorkspace.open('talk-1',{reference:'TBT-2026-001',topics:{chemical:{label:'Chemical / COSHH'}},assertContext:()=>{if(!viewValid)throw Error('Register changed');},openEditor:async current=>{if(fail)throw Error('Toolbox talk form could not open. No changes were saved.');viewValid=false;document.getElementById('result').textContent='Form handoff: toolbox_talks/talk-1 / '+current.companyId;}}).catch(error=>document.getElementById('result').textContent=error.message);if(mode==='stale')identity.company.id='another-company';}
['open','missing','history','fail','stale'].forEach(id=>document.getElementById(id).addEventListener('click',()=>launch(id)));
</script></body></html>
