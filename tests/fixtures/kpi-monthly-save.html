<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI monthly entry — synthetic QA</title><link rel="stylesheet" href="/auris-base.css"><link rel="stylesheet" href="/auris-kpi-legacy.css"><link rel="stylesheet" href="/kpi-module-upgrade.css"><link rel="stylesheet" href="/auris-settings-static.css"><style>body{display:block;margin:0;background:#f8fafc}main{padding:24px}nav{display:flex;gap:12px;flex-wrap:wrap}#fixture-result{white-space:pre-wrap;overflow-wrap:anywhere}#kpi-entry-modal{display:none}</style></head><body><main><h1>Monthly entry save outcomes</h1><p>Synthetic records only. No connection to any external API.</p><nav><label>Simulated service <select id="fixture-mode"><option value="failure">Value write failure</option><option value="summary">Summary failure</option><option value="reload">Reload failure</option><option value="changed">Company changes during save</option><option value="success">Success</option></select></label><button id="fixture-open" class="btn">Open August entry</button><button id="fixture-stored-open" class="btn">Open stored August result</button><select id="year-sel" aria-label="Reporting year"><option value="2025">2025</option></select></nav><p id="fixture-result" role="status">No simulated writes.</p></main><!-- MONTHLY_PANEL -->
<script>
var prof={id:'qa-user',company_id:'company-a'},kpiKPIs=[{id:'k',objective_id:'o',code:'1.1',name:'Toolbox talk coverage',frequency:'monthly',status:'not_started',company_id:'company-a'}],kpiIndicators=[{id:'i',kpi_id:'k',name:'Number of toolbox talks',target_value:4,target_operator:'gte',ytd_method:'sum'}],kpiObjectives=[{id:'o',name:'Safety culture'}],kpiMonthlyData={},kpiEntryIndicatorId=null,kpiEntryMonth=0,kpiEntryYear=2025,KPI_MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var fixtureStored=null,fixtureWrites=0,fixtureDeletes=0,fixtureKpi=kpiKPIs[0],fixtureInd=kpiIndicators[0];
function ccid(){return prof.company_id;}function isSA(){return false;}function kpiCanEdit(){return true;}function kpiFmtTarget(){return 4;}function kpiGetProgress(ind,value){return value/4*100;}
function kpiRenderOverview(){}function kpiRenderMonthly(){}function kpiUpdateMetrics(){}
function toast(message){document.getElementById('fixture-result').textContent=message+'\n'+fixtureWrites+' simulated value write(s), '+fixtureDeletes+' simulated clear(s).';}
async function api(url,options){var mode=document.getElementById('fixture-mode').value;if(url.startsWith('/kpi_monthly_data')&&options?.m==='DELETE'){fixtureDeletes++;toast('Clearing synthetic value…');await new Promise(resolve=>setTimeout(resolve,900));if(mode==='failure')throw new Error('Example clear connection failure.');fixtureStored=null;if(mode==='changed')prof.company_id='company-b';return null;}if(!options&&url.includes('order=month')&&mode==='summary'&&fixtureDeletes)throw new Error('Example YTD refresh failure.');if(url.startsWith('/kpi_monthly_data')&&options){fixtureWrites++;toast('Saving synthetic value…');await new Promise(resolve=>setTimeout(resolve,900));if(mode==='failure')throw new Error('Example connection failure.');fixtureStored={id:'synthetic-month',...fixtureStored,...options.b};if(mode==='changed')prof.company_id='company-b';return null;}if(url.startsWith('/kpis_v2')&&options){if(mode==='summary')throw new Error('Example summary failure.');return null;}if(url.startsWith('/objectives')){if(mode==='reload')throw new Error('Example reload failure.');return [{id:'o',name:'Safety culture'}];}if(url.startsWith('/kpis_v2'))return [fixtureKpi];if(url.startsWith('/kpi_indicators'))return [fixtureInd];if(url.startsWith('/kpi_monthly_data'))return fixtureStored?[fixtureStored]:[];throw new Error('Unexpected synthetic request');}
document.getElementById('fixture-stored-open').onclick=function(){prof.company_id='company-a';fixtureStored={id:'synthetic-month',indicator_id:'i',year:2025,month:8,actual:4,ytd:4,company_id:'company-a',comment:'Existing synthetic evidence'};kpiMonthlyData={i:{8:fixtureStored}};kpiOpenEntry('i','k',8);};
document.getElementById('fixture-open').onclick=function(){prof.company_id='company-a';kpiOpenEntry('i','k',8);};
</script><script src="/fixture-core.js"></script><script src="/auris-static-event-handlers.js"></script><script src="/fixture-module.js"></script></body></html>
