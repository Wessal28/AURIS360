<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI reporting cutoff — synthetic QA</title><link rel="stylesheet" href="/kpi-module-upgrade.css"><style>body{font:15px Arial,sans-serif;margin:0;background:#f4f7f9;color:#17324a}main{padding:16px;min-width:0}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button,select{font:inherit;min-height:44px;max-width:100%}h1{font-size:24px}#year-sel{display:none}.kpi-x-view{min-width:0}.kpi-x-month-scroll{max-width:100%;overflow:scroll}table{min-width:1900px}#fixture-note{line-height:1.5}</style></head><body><main id="page-kpi" data-kpi-x-installed="1"><h1>KPI reporting cutoff</h1><p>Synthetic data only. Clock fixed to January 2026; no external requests.</p><label for="scenario">Reporting scenario</label><select id="scenario"><option value="excluded">January — exclude current month</option><option value="included">January — include current month</option><option value="past">Previous reporting year</option><option value="future">Future reporting year</option></select><select id="year-sel"><option>2026</option></select><p id="fixture-note" role="status"></p><nav><button data-view="monthly">Monthly follow-up</button><button data-view="dashboard">Dashboard</button><button data-view="reports">Reports</button><button id="fixture-summary">Show YTD columns</button></nav><div id="kpi-objectives-container" class="kpi-x-view" data-kpi-view="scorecard"></div><div id="kpi-x-dashboard" class="kpi-x-view" data-kpi-view="dashboard"></div><div id="kpi-x-reports-view" class="kpi-x-view" data-kpi-view="reports"></div><section id="kpi-tab-monthly" class="kpi-x-view" data-kpi-view="monthly"><div class="kpi-x-month-scroll" tabindex="0" aria-label="Monthly KPI table"><table id="kpi-monthly-table" class="kpi-x-table"><thead></thead><tbody id="kpi-monthly-body"></tbody></table></div></section></main><script>
const NativeDate=Date;window.Date=class extends NativeDate{constructor(...args){super(...(args.length?args:['2026-01-15T12:00:00Z']));}static now(){return new this().getTime();}};
window.kpiObjectives=[{id:'o',code:'1',name:'Reporting cutoff'}];window.kpiKPIs=[{id:'k',objective_id:'o',code:'1.1',name:'Synthetic reporting',frequency:'monthly'}];window.kpiIndicators=[{id:'i',kpi_id:'k',name:'Completed work',target_operator:'gte',target_value:100}];window.kpiMonthlyData={i:{1:{month:1,actual:20,ytd:20},8:{month:8,actual:40,ytd:60},12:{month:12,actual:99,ytd:159}}};window.isMgr=()=>false;window.kpiCanEdit=()=>false;window.kpiConfigPublished={targets:{critical_override:true},calculations:{aggregation:'average'},cycles:{current_period_excluded:true}};
let fixtureView='monthly';function fixtureScenario(){const mode=document.getElementById('scenario').value,year=mode==='past'?2025:mode==='future'?2027:2026;document.getElementById('year-sel').innerHTML='<option>'+year+'</option>';kpiConfigPublished.cycles.current_period_excluded=mode!=='included';document.getElementById('fixture-note').textContent='Selected year: '+year+'. Stored results: January 20 (YTD 20), August 40 (YTD 60), December 99 (YTD 159).';kpiXSwitchTab(fixtureView);}
</script><script src="/kpi-module-upgrade.js"></script><style>
/* QA-only scaffold: expose result cells without the full app's frozen columns. */
#page-kpi #kpi-monthly-table th,#page-kpi #kpi-monthly-table td{position:static!important;min-width:70px;white-space:nowrap}
#page-kpi #kpi-monthly-table th{color:#17324a!important}
#kpi-monthly-table td{background:#fff;color:#17324a}
</style><p style="padding:16px">This calculation fixture uses simplified table styling without frozen columns. It is not a full-app or physical-device layout test.</p><script>document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{fixtureView=button.dataset.view;fixtureScenario();}));document.getElementById('scenario').addEventListener('change',fixtureScenario);document.getElementById('fixture-summary').addEventListener('click',()=>{const table=document.querySelector('.kpi-x-month-scroll');table.scrollLeft=table.scrollWidth;});document.addEventListener('DOMContentLoaded',fixtureScenario);</script></body></html>
